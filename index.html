<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mama Njeri Restaurant</title>
</head>

<body>
    <h1>Welcome to Mama Njeri's Restaurant</h1>

    <table border="1">
        <caption>Menu</caption>
        <thead style="background-color: yellow;">
            <tr>
                <th>Dish</th>
                <th>Price</th>
                <th>Sample Image</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Pilau</td>
                <td>Ksh: 350</td>
                <td>
                    <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse1.mm.bing.net%2Fth%2Fid%2FOIP.T3x6HPpD9CVsG6QvKW2zgQHaE8%3Fpid%3DApi&f=1&ipt=1a4ce28c1838182bb6a85ddf0d6461865c2c36715b5f0a6b7c3dd56d5e825276&ipo=images"
                        alt="Pilau" style="width: 85px;">
                </td>
            </tr>
            <tr>
                <td>Ugali &amp; Sukuma</td>
                <td>Ksh: 250</td>
                <td>
                    <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fwww.nationaldish.world%2Fwp-content%2Fuploads%2Ftraditional-Dish-Of-Kenya-Ugali-with-Sukuma-Wiki-and-Nyama-Choma.jpg&f=1&nofb=1&ipt=efe23d714d53a5977fa83cce5a1992119f31e147b4893c3ce3baa3218cf04f70&ipo=images"
                        alt="Ugali and Sukuma" style="width: 85px;">
                </td>
            </tr>
            <tr>
                <td>Chapati (2)</td>
                <td>Ksh: 100</td>
                <td>
                    <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fpastrymachinery.com%2Fwp-content%2Fuploads%2F2021%2F10%2F21-chapati-bread-sample.jpg&f=1&nofb=1&ipt=6583e2f8343d13c48f47da7f5a91d6493c78d0007410979fc5a610a5d854022b&ipo=images"
                        alt="Chapati" style="width: 85px;">
                </td>
            </tr>
        </tbody>
    </table>

    <form style="padding-top: 20px;">
        <fieldset>
            <legend>Student Registration Form</legend>

            <label for="firstName">First Name</label>
            <input type="text" name="firstName" id="firstName" required placeholder="First Name">

            <br><br>

            <label for="password">Password</label>
            <input type="password" name="password" id="password" required placeholder="Enter your Password">

            <br><br>

            <button type="submit">Register</button>
        </fieldset>
    </form>
</body>

</html>
